[project]
name = "SmartFuel"
version = "0.0.01"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "dotenv==0.9.9",
    "pre-commit>=4.7.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "flake8>=7",
    "gunicorn",
    "isort>=9.0.0",
    "pre-commit>=4.0.1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.isort]
profile = "black"
src_paths = ["."]
skip_glob = ["*/migrations/*"]
